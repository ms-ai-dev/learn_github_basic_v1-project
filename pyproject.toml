[project]
name = "learn_github_basic_v1"
description = "A beginner-friendly introduction to the basic GitHub workflow: creating repos, branches and PRs, access control, and GitHub Desktop. No command line, and not only for people who write code."
version = "0.1.1"
requires-python = ">=3.12,<4.0"
dependencies = [
]

[tool.setuptools.packages.find]
where = ["."]
include = ["learn_github_basic_v1*"]
exclude = [
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
